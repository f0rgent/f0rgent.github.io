<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Snooze">
<meta name="theme-color" content="#000000">
<title>Snooze, reimagined</title>
<meta name="description" content="Ten ways to snooze an alarm, in liquid glass. A concept by @f0rgent.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,500;14..32,600;14..32,700;14..32,800&family=JetBrains+Mono:wght@700&display=swap">
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;touch-action:none}
#al{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(60px + env(safe-area-inset-bottom,0px));z-index:3;color:#fff;text-decoration:none;font:600 14px Inter,system-ui,sans-serif;padding:11px 18px;border-radius:999px;border:1px solid rgba(255,255,255,.35);background:rgba(0,0,0,.28);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);white-space:nowrap}
canvas.framed{border-radius:44px;box-shadow:0 0 0 10px #1a1a1e,0 30px 90px rgba(0,0,0,.7)}</style></head>
<body><canvas id="c" width="1080" height="1350"></canvas><a id="al" href="alarm/">Use it as my alarm →</a><script src="snooze.js"></script>
<script>
(() => { const c = document.getElementById('c'); const fit = () => { const vw = innerWidth, vh = innerHeight, ar = c.width / c.height;
  const portrait = vh / vw >= 1.6; let w, hh;
  if (portrait) { w = vw; hh = vh; c.classList.remove('framed'); } else { hh = vh * 0.92; w = hh * ar; if (w > vw * 0.92) { w = vw * 0.92; hh = w / ar; } c.classList.add('framed'); }
  c.style.width = w + 'px'; c.style.height = hh + 'px'; }; fit(); addEventListener('resize', fit); })();
</script></body></html>
